name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run the test suites
        run: npm test

      - name: Smoke test the built server without credentials
        if: matrix.node-version == '22'
        run: |
          set -euo pipefail
          PORT=3110 node dist/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3110/api/health; then
              break
            fi
            sleep 1
          done

          health=$(curl -fsS http://127.0.0.1:3110/api/health)
          echo "health: $health"
          grep -q '"status":"ok"' <<< "$health"

          homepage=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3110/)
          echo "GET / -> $homepage"
          test "$homepage" = "200"

          script=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3110/app.js)
          echo "GET /app.js -> $script"
          test "$script" = "200"

          availability=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3110/api/slots/available)
          echo "GET /api/slots/available without calendar credentials -> $availability"
          test "$availability" = "503"
